---
name: AgentExecutionTestSuite
description: Verification tests for agent execution policies
principals:
  orchestrator:
    id: orchestrator-agent
    roles:
      - orchestrator
    attr:
      tenant_id: tenant-demo
  untrusted:
    id: untrusted-agent
    roles:
      - untrusted
    attr:
      tenant_id: tenant-demo

resources:
  browser:
    id: browser-agent
    kind: agent
  research:
    id: research-agent
    kind: agent
  restricted:
    id: restricted-agent
    kind: agent
  browser_valid_auth0_user:
    id: browser-agent
    kind: agent
    attr:
      tenant_id: tenant-demo
      user:
        id: "auth0|user-123"
        tenant_id: tenant-demo
        permissions:
          - agent:execute
          - browser:read
  browser_missing_execute_perm:
    id: browser-agent
    kind: agent
    attr:
      tenant_id: tenant-demo
      user:
        id: "auth0|user-123"
        tenant_id: tenant-demo
        permissions:
          - browser:read
  browser_wrong_tenant_user:
    id: browser-agent
    kind: agent
    attr:
      tenant_id: tenant-demo
      user:
        id: "auth0|user-123"
        tenant_id: tenant-other
        permissions:
          - agent:execute

tests:
  - name: OrchestratorApprovedAgents
    input:
      principals:
        - orchestrator
      resources:
        - browser
        - research
      actions:
        - execute
    expected:
      - principal: orchestrator
        resource: browser
        actions:
          execute: EFFECT_ALLOW
      - principal: orchestrator
        resource: research
        actions:
          execute: EFFECT_ALLOW

  - name: OrchestratorRestrictedAgent
    input:
      principals:
        - orchestrator
      resources:
        - restricted
      actions:
        - execute
    expected:
      - principal: orchestrator
        resource: restricted
        actions:
          execute: EFFECT_DENY

  - name: UntrustedPrincipalExecution
    input:
      principals:
        - untrusted
      resources:
        - browser
        - research
      actions:
        - execute
    expected:
      - principal: untrusted
        resource: browser
        actions:
          execute: EFFECT_DENY
      - principal: untrusted
        resource: research
        actions:
          execute: EFFECT_DENY

  - name: UnauthorizedActions
    input:
      principals:
        - orchestrator
      resources:
        - browser
      actions:
        - admin
        - delete
    expected:
      - principal: orchestrator
        resource: browser
        actions:
          admin: EFFECT_DENY
          delete: EFFECT_DENY

  - name: Auth0UserDelegationValid
    input:
      principals:
        - orchestrator
      resources:
        - browser_valid_auth0_user
      actions:
        - execute
    expected:
      - principal: orchestrator
        resource: browser_valid_auth0_user
        actions:
          execute: EFFECT_ALLOW

  - name: Auth0UserDelegationMissingPermission
    input:
      principals:
        - orchestrator
      resources:
        - browser_missing_execute_perm
      actions:
        - execute
    expected:
      - principal: orchestrator
        resource: browser_missing_execute_perm
        actions:
          execute: EFFECT_DENY

  - name: Auth0UserDelegationWrongTenant
    input:
      principals:
        - orchestrator
      resources:
        - browser_wrong_tenant_user
      actions:
        - execute
    expected:
      - principal: orchestrator
        resource: browser_wrong_tenant_user
        actions:
          execute: EFFECT_DENY
