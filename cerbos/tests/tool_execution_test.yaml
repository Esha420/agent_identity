---
name: ToolExecutionTestSuite
description: Verification tests for runtime tool execution policies
principals:
  browser_worker:
    id: browser-agent
    roles:
      - browser-worker
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      parent_principal: orchestrator-agent
      delegated_by: user-123

  untrusted_worker:
    id: untrusted-agent
    roles:
      - untrusted
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      parent_principal: orchestrator-agent
      delegated_by: user-123

resources:
  fetch_url_valid:
    id: fetch_url
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-123
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
        - docs.example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: GET
      host: example.com
      scheme: https
      port: 443
      ip_valid: true

  fetch_url_invalid_method:
    id: fetch_url
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-123
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: POST
      host: example.com
      scheme: https
      port: 443
      ip_valid: true

  fetch_url_invalid_host:
    id: fetch_url
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-123
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: GET
      host: attacker.com
      scheme: https
      port: 443
      ip_valid: true

  fetch_url_mismatched_task:
    id: fetch_url
    kind: tool
    attr:
      task_id: forged-task-999
      tenant_id: tenant-demo
      delegated_by: user-123
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: GET
      host: example.com
      scheme: https
      port: 443
      ip_valid: true

  filesystem_read_valid:
    id: filesystem_read
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-123
      path_contained: true

  filesystem_read_uncontained:
    id: filesystem_read
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-123
      path_contained: false

  fetch_url_mismatched_tenant:
    id: fetch_url
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-other
      delegated_by: user-123
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: GET
      host: example.com
      scheme: https
      port: 443
      ip_valid: true

  fetch_url_mismatched_delegated_by:
    id: fetch_url
    kind: tool
    attr:
      task_id: task-test-001
      tenant_id: tenant-demo
      delegated_by: user-other
      allowed_methods:
        - GET
      allowed_hosts:
        - example.com
      allowed_schemes:
        - https
      allowed_ports:
        - 443
      method: GET
      host: example.com
      scheme: https
      port: 443
      ip_valid: true

tests:
  - name: ValidFetchUrlAllowed
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_valid
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_valid
        actions:
          request: EFFECT_ALLOW

  - name: MethodNotAllowedDenied
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_invalid_method
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_invalid_method
        actions:
          request: EFFECT_DENY

  - name: HostNotAllowedDenied
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_invalid_host
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_invalid_host
        actions:
          request: EFFECT_DENY

  - name: TaskIdMismatchDenied
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_mismatched_task
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_mismatched_task
        actions:
          request: EFFECT_DENY

  - name: ContainedFilesystemReadAllowed
    input:
      principals:
        - browser_worker
      resources:
        - filesystem_read_valid
      actions:
        - read
    expected:
      - principal: browser_worker
        resource: filesystem_read_valid
        actions:
          read: EFFECT_ALLOW

  - name: UncontainedFilesystemReadDenied
    input:
      principals:
        - browser_worker
      resources:
        - filesystem_read_uncontained
      actions:
        - read
    expected:
      - principal: browser_worker
        resource: filesystem_read_uncontained
        actions:
          read: EFFECT_DENY

  - name: UntrustedRoleDenied
    input:
      principals:
        - untrusted_worker
      resources:
        - fetch_url_valid
      actions:
        - request
    expected:
      - principal: untrusted_worker
        resource: fetch_url_valid
        actions:
          request: EFFECT_DENY

  - name: TenantMismatchDenied
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_mismatched_tenant
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_mismatched_tenant
        actions:
          request: EFFECT_DENY

  - name: DelegatedUserMismatchDenied
    input:
      principals:
        - browser_worker
      resources:
        - fetch_url_mismatched_delegated_by
      actions:
        - request
    expected:
      - principal: browser_worker
        resource: fetch_url_mismatched_delegated_by
        actions:
          request: EFFECT_DENY
