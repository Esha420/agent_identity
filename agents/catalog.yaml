# Declarative Agent Catalog
# Defines external agent images, capabilities, and execution parameters

agents:
  browser-agent:
    name: "browser-agent"
    description: "Upstream Browser Automation Agent navigating web pages and extracting structured DOM content"
    source:
      repository: "https://github.com/EmergenceAI/Agent-E"
      category: "Browser"
    runtime:
      type: "substrate-container"
      image: "localhost:5001/browser-agent@sha256:8abae590b3dcf422089e17b4219c0c7136fd84384ea228af1e66381d5ced4f8f"
      command:
        - "python3"
        - "/agent/browser_cli.py"
      default_args:
        - "--url"
        - "http://mock-target:8089"
    capabilities:
      - "browser"
      - "web"
      - "dom-extraction"

  research-agent:
    name: "research-agent"
    description: "Upstream OpenClaw Autonomous Research Agent executing research tooling pipeline"
    source:
      repository: "https://github.com/openclaw/openclaw"
      category: "Research"
    runtime:
      type: "substrate-container"
      image: "localhost:5001/openclaw-agent@sha256:3a00eb8df2f127b46e926dcea420ade1d46f8723b0ec7abb4b3610637569f7d9"
      command:
        - "python3"
        - "-c"
        - "import json, os; print('[*] Research Agent completed topic research.'); res={'status':'COMPLETED','intel':'autonomous-agent-architecture'}; print(json.dumps(res))"
    capabilities:
      - "research"
      - "analysis"
      - "intel-gathering"

  restricted-agent:
    name: "restricted-agent"
    description: "Sensitive/Restricted Internal Agent requiring explicit administrative policy authorization"
    source:
      repository: "internal/restricted"
      category: "Restricted"
    runtime:
      type: "substrate-container"
      image: "localhost:5001/openclaw-agent@sha256:3a00eb8df2f127b46e926dcea420ade1d46f8723b0ec7abb4b3610637569f7d9"
      command:
        - "/bin/echo"
        - "RESTRICTED EXECUTION"
    capabilities:
      - "privileged-access"
      - "security-override"
